name: one_note
description: "A new Flutter project like OneNote"

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  cloud_firestore: ^5.6.8
  firebase_auth: ^5.5.4
  firebase_core: ^3.13.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0-dev.15
  flutter_slidable: ^4.0.0
  google_sign_in: ^6.2.1
  riverpod_annotation: ^3.0.0-dev.15


dev_dependencies:
  custom_lint: ^0.7.5
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  riverpod_lint: ^3.0.0-dev.15
  very_good_analysis: ^7.0.0

